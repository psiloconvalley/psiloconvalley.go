<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#060e1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff8a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39ff8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff8a" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39ff8a" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Deep background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect width="32" height="32" rx="8" fill="url(#aurora)"/>

  <!-- Ambient glow -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)"/>

  <!-- Mycelium threads — branching from center -->
  <g stroke="#39ff8a" fill="none" stroke-linecap="round">
    <!-- Primary hyphae -->
    <path d="M16,16 L6,8" stroke-width="0.4" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L26,6" stroke-width="0.4" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L28,20" stroke-width="0.4" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L4,22" stroke-width="0.4" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L10,28" stroke-width="0.4" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L24,28" stroke-width="0.4" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.7s" repeatCount="indefinite"/>
    </path>

    <!-- Secondary branches -->
    <path d="M10,12 L4,14" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M22,10 L28,12" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <path d="M22,22 L26,26" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5.2s" repeatCount="indefinite"/>
    </path>
    <path d="M10,22 L6,26" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.6s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L16,4" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M16,16 L16,30" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Nutrient nodes — endpoints of the network -->
  <g fill="#39ff8a">
    <circle cx="6" cy="8" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="6" r="0.8" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="20" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="4" cy="22" r="0.8" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="28" r="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="28" r="0.8" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="4" r="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- The Vesica Piscis -->
  <circle cx="12" cy="16" r="8" fill="none" stroke="#39ff8a" stroke-width="0.8" opacity="0.4"/>
  <circle cx="20" cy="16" r="8" fill="none" stroke="#39ff8a" stroke-width="0.8" opacity="0.4"/>

  <!-- Outer boundary ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#39ff8a" stroke-width="0.3" opacity="0.15"/>

  <!-- Inner light bloom -->
  <circle cx="16" cy="16" r="5" fill="#39ff8a" opacity="0.05">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- The Central Spore -->
  <circle cx="16" cy="16" r="2.5" fill="#39ff8a" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
